<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>學生會離職申請</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    height: 100vh;
    margin: 0;
    background: #fdf6f0;
    overflow: hidden;
    font-family: sans-serif;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h2 {
    margin-top: 20px;
    color: #ff5e9c;
  }

  .box {
    position: relative;
    margin-top: auto;
    margin-bottom: 50px;
  }

  button {
    padding: 14px 28px;
    font-size: 18px;
    margin: 0 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  #agree { background: #ffd6e7; }
  #reject { background: #eee; position: absolute; }

  #face {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }

  .eyes {
    position: absolute;
    top: 22px;
    display: flex;
    gap: 10px;
  }

  .eye {
    width: 8px;
    height: 8px;
    background: #000;
    border-radius: 50%;
    transition: transform 0.1s;
  }

  .mouth {
    position: absolute;
    bottom: 14px;
    font-size: 14px;
  }

  .shake {
    animation: shake 0.2s infinite;
  }

  @keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(2px,-2px); }
    100% { transform: translate(0,0); }
  }

  /* 小彩帶效果 */
  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: red;
    opacity: 0.8;
    pointer-events: none;
    animation: fall 2s linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
  }

  #celebrate {
    position: absolute;
    top: 40%;
    font-size: 24px;
    color: #ff5e9c;
    font-weight: bold;
    display: none;
    pointer-events: none;
  }
</style>
</head>

<body>

<h2>學生會離職申請</h2>

<div class="box">
  <button id="agree">同意</button>
  <button id="reject">拒絕</button>
</div>

<div id="face">
  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>
  <div class="mouth">︶</div>
</div>

<div id="celebrate">好耶，你最好了！🎉</div>

<script>
const face = document.getElementById("face");
const eyes = document.querySelectorAll(".eye");
const mouth = document.querySelector(".mouth");
const agree = document.getElementById("agree");
const reject = document.getElementById("reject");
const celebrate = document.getElementById("celebrate");

const faceSize = 60; 
const buttonWidth = 100; 
const buttonHeight = 50; 

// 表情跟隨滑鼠或手指
function move(e) {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;

  const safeX = Math.min(Math.max(x, faceSize/2), window.innerWidth - faceSize/2);
  const safeY = Math.min(Math.max(y, faceSize/2 + 100), window.innerHeight - faceSize/2);

  face.style.left = safeX + "px";
  face.style.top = safeY + "px";

  const dReject = dist(safeX, safeY, reject);
  const dAgree = dist(safeX, safeY, agree);

  face.className = "";

  if (dReject < 160) {
    const r = reject.getBoundingClientRect();
    const dir = r.left + r.width/2 < safeX ? -3 : 3;
    eyes.forEach(e => e.style.transform = `translateX(${dir}px)`);
  } else {
    eyes.forEach(e => e.style.transform = "translateX(0)");
  }

  if (dReject < 80) {
    face.classList.add("shake");
    mouth.textContent = "﹏";
  } else if (dAgree < 80) {
    mouth.textContent = "︶";
  } else {
    mouth.textContent = "︶";
  }
}

document.addEventListener("mousemove", move);
document.addEventListener("touchmove", move);

// 拒絕按鈕亂跑
reject.addEventListener("click", () => {
  const safeX = Math.random() * (window.innerWidth - buttonWidth);
  const safeY = Math.random() * (window.innerHeight - buttonHeight - 150) + 100;
  reject.style.left = safeX + "px";
  reject.style.top = safeY + "px";
});

// 同意按鈕 → 顯示文字 + 彩帶效果
agree.addEventListener("click", () => {
  celebrate.style.display = "block";
  createConfetti();
  setTimeout(() => { celebrate.style.display = "none"; }, 3000);
});

function createConfetti() {
  for(let i=0; i<50; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 2000);
  }
}

// 計算距離
function dist(x, y, el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  return Math.hypot(x - cx, y - cy);
}
</script>

</body>
</html>
