<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>學生會離職申請</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  background:#fdf6f0;
  font-family:'Microsoft JhengHei',sans-serif;
  overflow:hidden;
}

h2 {
  margin:20px;
  color:#ff5e9c;
  font-size:32px;
}

.container {
  display:flex;
  justify-content:space-around;
  width:100%;
  max-width:500px;
  margin-top:250px;
  position:relative;
}

button {
  padding:14px 28px;
  font-size:18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  transition: transform 0.2s;
}

#agree { background:#ffd6e7; }
#reject { background:#eee; }

#face {
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  background:#fff;
  top:100px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  z-index:10;
  transition: all 0.1s;
}

.eyes { display:flex; gap:15px; }
.eye { width:12px; height:12px; background:#000; border-radius:50%; transition:transform 0.1s; }
.mouth { font-size:18px; transition: all 0.1s; }
.shake { animation:shake 0.2s infinite; }

@keyframes shake {
  0% {transform:translate(0,0);}
  50% {transform:translate(3px,-3px);}
  100% {transform:translate(0,0);}
}

.confetti { position:absolute; width:8px; height:8px; opacity:0.8; pointer-events:none; animation:fall 2s linear forwards; }
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg);}
  100% { transform: translateY(400px) rotate(360deg); opacity:0;}
}

#celebrate {
  position:absolute;
  top:50px;
  font-size:28px;
  color:#1e90ff;
  font-family:'Comic Sans MS',cursive;
  font-weight:bold;
  display:none;
  pointer-events:none;
  text-shadow:1px 1px 2px #aaa;
}

#rejectMsg {
  position:absolute;
  font-size:24px;
  color:#ff3b3b;
  font-family:'Comic Sans MS',cursive;
  font-weight:bold;
  display:none;
  pointer-events:none;
  text-shadow:1px 1px 2px #aaa;
}
</style>
</head>

<body>

<h2>學生會離職申請</h2>

<div class="container">
  <button id="reject">拒絕</button>
  <button id="agree">同意</button>
</div>

<div id="face">
  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>
  <div class="mouth">︶</div>
</div>

<div id="celebrate">好耶，你最好了！ 🎉</div>
<div id="rejectMsg">壞人，我不跟你好 🥺</div>

<script>
const face = document.getElementById("face");
const eyesContainer = document.querySelector(".eyes");
const eyes = document.querySelectorAll(".eye");
const mouth = document.querySelector(".mouth");
const agree = document.getElementById("agree");
const reject = document.getElementById("reject");
const celebrate = document.getElementById("celebrate");
const rejectMsg = document.getElementById("rejectMsg");

let rejectClicks = 0;

// 表情靠近按鈕變化
function updateFace(e){
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;

  const rejectRect = reject.getBoundingClientRect();
  const agreeRect = agree.getBoundingClientRect();

  const distReject = Math.hypot(x - (rejectRect.left + rejectRect.width/2), y - (rejectRect.top + rejectRect.height/2));
  const distAgree = Math.hypot(x - (agreeRect.left + agreeRect.width/2), y - (agreeRect.top + agreeRect.height/2));

  if(distReject < 100 && !(x>rejectRect.left && x<rejectRect.right && y>rejectRect.top && y<rejectRect.bottom)){
    face.classList.add("shake");
    mouth.textContent="﹏"; // 緊張
    eyesContainer.style.display="flex";
  } else if(x>rejectRect.left && x<rejectRect.right && y>rejectRect.top && y<rejectRect.bottom){
    face.classList.remove("shake");
    mouth.textContent="T_T"; // 哭
    eyesContainer.style.display="none"; // 眼睛消失
  } else if(distAgree<100){
    face.classList.remove("shake");
    mouth.textContent="︶"; // 笑
    eyesContainer.style.display="flex";
  } else {
    face.classList.remove("shake");
    mouth.textContent="︶";
    eyesContainer.style.display="flex";
  }
}

document.addEventListener("mousemove", updateFace);
document.addEventListener("touchmove", updateFace);

// 拒絕鍵逃跑 + 按下後顯示文字五秒
reject.addEventListener("click", ()=>{
  rejectClicks++;
  if(rejectClicks>=1){
    rejectMsg.style.display="block";
    const rect = reject.getBoundingClientRect();
    rejectMsg.style.left = rect.left - 20 + "px";
    rejectMsg.style.top = rect.top - 80 + "px"; // 上移文字，不被表情擋到

    // 文字五秒後消失
    setTimeout(()=>{
      rejectMsg.style.display="none";
    }, 5000);
  }

  // 逃跑，用 transform
  const maxX = window.innerWidth - reject.offsetWidth;
  const maxY = window.innerHeight - reject.offsetHeight - 150;
  const randX = Math.random()*maxX;
  const randY = Math.random()*maxY;
  reject.style.transform=`translate(${randX-reject.offsetLeft}px, ${randY-reject.offsetTop}px)`;
});

// 同意 → 彩帶 + 文字
agree.addEventListener("click", ()=>{
  celebrate.style.display="block";
  createConfetti();
  setTimeout(()=>celebrate.style.display="none",3000);
});

function createConfetti(){
  for(let i=0;i<50;i++){
    const confetti=document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left=Math.random()*window.innerWidth+"px";
    confetti.style.background=`hsl(${Math.random()*360},80%,60%)`;
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(),2000);
  }
}
</script>

</body>
</html>
