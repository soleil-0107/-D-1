<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>學生會離職申請</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    height: 100vh;
    margin: 0;
    background: #fdf6f0;
    font-family: 'Microsoft JhengHei', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    touch-action: none;
  }

  h2 {
    color: #ff5e9c;
    margin-top: 30px;
    font-size: 32px;
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 150px;
    position: relative;
    width: 100%;
    margin-top: 50px;
  }

  button {
    padding: 14px 28px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    position: relative;
  }

  #agree { background: #ffd6e7; }
  #reject { background: #eee; }

  #face {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
  }

  .eyes {
    position: absolute;
    top: 30px;
    display: flex;
    gap: 15px;
  }

  .eye {
    width: 12px;
    height: 12px;
    background: #000;
    border-radius: 50%;
    transition: transform 0.1s;
  }

  .mouth {
    position: absolute;
    bottom: 20px;
    font-size: 18px;
    transition: all 0.2s;
  }

  .shake {
    animation: shake 0.2s infinite;
  }

  @keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(3px,-3px); }
    100% { transform: translate(0,0); }
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    opacity: 0.8;
    pointer-events: none;
    animation: fall 2s linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
  }

  #celebrate {
    position: absolute;
    top: 120px;
    font-size: 28px;
    color: #1e90ff;
    font-family: 'Comic Sans MS', cursive;
    font-weight: bold;
    display: none;
    pointer-events: none;
    text-shadow: 1px 1px 2px #aaa;
  }

  #rejectMsg {
    position: absolute;
    top: 60px;
    font-size: 24px;
    color: #ff3b3b;
    font-family: 'Comic Sans MS', cursive;
    font-weight: bold;
    display: none;
    pointer-events: none;
    text-shadow: 1px 1px 2px #aaa;
  }

</style>
</head>

<body>

<h2>學生會離職申請</h2>

<div class="container">
  <button id="reject">拒絕</button>
  <div id="face">
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth">︶</div>
  </div>
  <button id="agree">同意</button>
</div>

<div id="celebrate">好耶，你最好了！ 🎉</div>
<div id="rejectMsg">壞人，我不跟你好 😢</div>

<script>
const face = document.getElementById("face");
const eyes = document.querySelectorAll(".eye");
const mouth = document.querySelector(".mouth");
const agree = document.getElementById("agree");
const reject = document.getElementById("reject");
const celebrate = document.getElementById("celebrate");
const rejectMsg = document.getElementById("rejectMsg");

const faceSize = 100;
const buttonWidth = 100;
const buttonHeight = 50;

// 拒絕鍵需要按 3 次才消失
let rejectClicks = 0;

// 拒絕按鈕亂跑
reject.addEventListener("click", () => {
  rejectClicks++;
  if (rejectClicks >= 3) {
    reject.style.display = "none";
  } else {
    // 表情變哭，文字出現
    mouth.textContent = "T_T";
    rejectMsg.style.display = "block";
    setTimeout(() => {
      mouth.textContent = "︶"; // 回到正常
      rejectMsg.style.display = "none";
    }, 1500);

    // 慢慢逃跑到畫面內隨機位置
    const safeX = Math.random() * (window.innerWidth - buttonWidth);
    const safeY = Math.random() * (window.innerHeight - buttonHeight - 150) + 150;
    reject.style.position = "absolute";
    reject.style.left = safeX + "px";
    reject.style.top = safeY + "px";
  }
});

// 表情固定在畫面中央偏上
const faceX = window.innerWidth / 2 - faceSize/2;
const faceY = 250;
face.style.left = faceX + "px";
face.style.top = faceY + "px";

// 眼睛偷看拒絕鍵，靠近抖動
function checkEyes() {
  if (reject.style.display === "none") return;
  const r = reject.getBoundingClientRect();
  const distX = Math.abs(r.left + r.width/2 - (faceX + faceSize/2));
  if (distX < 120) {
    face.classList.add("shake");
    eyes.forEach(e => e.style.transform = `translateX(${r.left + r.width/2 < faceX + faceSize/2 ? -3 : 3}px)`);
    mouth.textContent = "﹏"; // 緊張表情
  } else {
    face.classList.remove("shake");
    eyes.forEach(e => e.style.transform = "translateX(0)");
    mouth.textContent = "︶";
  }
}
setInterval(checkEyes, 100);

// 同意按鈕 → 顯示文字 + 彩帶
agree.addEventListener("click", () => {
  celebrate.style.display = "block";
  createConfetti();
  setTimeout(() => { celebrate.style.display = "none"; }, 3000);
});

function createConfetti() {
  for(let i=0; i<50; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 2000);
  }
}
</script>

</body>
</html>
