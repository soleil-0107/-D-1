<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>學生會離職申請</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    height: 100vh;
    margin: 0;
    background: #fdf6f0;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }

  h2 {
    color: #ff5e9c;
    margin-bottom: 50px;
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 100px; /* 按鈕分開 */
    position: relative;
    width: 100%;
  }

  button {
    padding: 14px 28px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    position: relative;
  }

  #agree { background: #ffd6e7; }
  #reject { background: #eee; }

  #face {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    left: 50%;
    transform: translateX(-50%);
    top: 50%;
    margin-top: -40px;
  }

  .eyes {
    position: absolute;
    top: 25px;
    display: flex;
    gap: 12px;
  }

  .eye {
    width: 10px;
    height: 10px;
    background: #000;
    border-radius: 50%;
    transition: transform 0.1s;
  }

  .mouth {
    position: absolute;
    bottom: 18px;
    font-size: 16px;
  }

  .shake {
    animation: shake 0.2s infinite;
  }

  @keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(3px,-3px); }
    100% { transform: translate(0,0); }
  }

  /* 彩帶效果 */
  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    opacity: 0.8;
    pointer-events: none;
    animation: fall 2s linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
  }

  #celebrate {
    position: absolute;
    top: 30%;
    font-size: 26px;
    color: #ff5e9c;
    font-weight: bold;
    display: none;
    pointer-events: none;
  }
</style>
</head>

<body>

<h2>學生會離職申請</h2>

<div class="container">
  <button id="reject">拒絕</button>
  <div id="face">
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth">︶</div>
  </div>
  <button id="agree">同意</button>
</div>

<div id="celebrate">好耶，你最好了！🎉</div>

<script>
const face = document.getElementById("face");
const eyes = document.querySelectorAll(".eye");
const mouth = document.querySelector(".mouth");
const agree = document.getElementById("agree");
const reject = document.getElementById("reject");
const celebrate = document.getElementById("celebrate");

const faceSize = 80;
const buttonWidth = 100;
const buttonHeight = 50;

// 表情固定在畫面中間
const faceX = window.innerWidth / 2 - faceSize/2;
const faceY = window.innerHeight / 2 - faceSize/2;
face.style.left = faceX + "px";
face.style.top = faceY + "px";

// 眼睛偷看拒絕鍵
function checkEyes() {
  const r = reject.getBoundingClientRect();
  const dir = r.left + r.width/2 < faceX + faceSize/2 ? -3 : 3;
  eyes.forEach(e => e.style.transform = `translateX(${dir}px)`);
}

setInterval(checkEyes, 100);

// 拒絕按鈕亂跑
reject.addEventListener("click", () => {
  const safeX = Math.random() * (window.innerWidth - buttonWidth);
  const safeY = Math.random() * (window.innerHeight - buttonHeight);
  reject.style.position = "absolute";
  reject.style.left = safeX + "px";
  reject.style.top = safeY + "px";
});

// 同意按鈕 → 顯示文字 + 彩帶
agree.addEventListener("click", () => {
  celebrate.style.display = "block";
  createConfetti();
  setTimeout(() => { celebrate.style.display = "none"; }, 3000);
});

function createConfetti() {
  for(let i=0; i<50; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 2000);
  }
}
</script>

</body>
</html>
